<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fotogram</title>
    <link rel="icon" type="image/png" href="./assets/icons/logo-img.png">
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <header>
        <nav>
            <img src="./assets/icons/logo-complete.png">
        </nav>
    </header>
    <main>
        <div id="content">
            <h1 id="title">Your personal photo album</h1>
            <section id="gallery">

            </section>
        </div> 
        <dialog id="dialogId">
            <section class="sectionHeader">
                <h2>
                    text
                </h2>
                <button>
                    <img src="./assets/icons/close-default.png" onclick="closeDialog()" onmouseover="this.src='./assets/icons/close-hover.png';" onmouseout="this.src='./assets/icons/close-default.png';" onmousedown="this.src='./assets/icons/close-while-pressing.png';">
                </button>
            </section>
            <section class="sectionImg">
                <img src="./assets/img/Alaska.jpg" alt="photo" class="img-content">                
            </section>
            <section class="sectionButtons">
                <button >
                    <img src="./assets/icons/arrow-left.png" alt="arrow-left" onmouseover="this.src='./assets/icons/arrow-left-hover.png';" onmouseout="this.src='./assets/icons/arrow-left.png';">
                </button>
                <p>
                    text
                </p>
                <button >
                    <img src="./assets/icons/arrow-right.png" alt="arrow-right" onmouseover="this.src='./assets/icons/arrow-right-hover.png';" onmouseout="this.src='./assets/icons/arrow-right.png';">
                </button>
            </section>
        </dialog>
        
    </main>
    <footer>
        <img class="subtract" src="./assets/icons/Subtract.png" alt="footer-img1">
        <div class="DA">
            <div class="DA-logo">
                <img src="./assets/icons/DA-icon.png" alt="da-icon">
                <img src="./assets/icons/DA-text.png" alt="da-text">
            </div>
            <!-- <div class="DA-text"> -->
                <p>© 2023 Developer Akademie GmbH</p>
            <!-- </div> -->

        </div>
    </footer>
    <script src="script.js"></script>
</body>

</html>
